[project]
name = "rag-test"
version = "0.1.0"
description = "Lokale RAG-Testpipeline (Ollama, SQLite, Flask)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
    "typer>=0.12",
    "flask>=3.0",
    "waitress>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
